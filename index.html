<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pedigree Builder</title>
<meta name="description" content="Pedigree Builder: an editable family-tree pedigree chart that runs in your browser. Import and export GEDCOM, record sources, DNA and haplogroups, and explore your ancestry.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2315201D'/%3E%3Cpath d='M9 16h5M14 9v14M14 9h4M14 23h4' stroke='%23F9FBFA' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3Crect x='4' y='13' width='6' height='6' rx='1.5' fill='%2386B3EA'/%3E%3Crect x='18' y='6' width='6' height='6' rx='1.5' fill='%23EE92B0'/%3E%3Crect x='18' y='20' width='6' height='6' rx='1.5' fill='%236FCFA3'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap">
<link rel="stylesheet" href="css/styles.css" data-pb>
</head>
<body>
<header class="top">
  <div class="id">
    <p class="kicker" id="kicker">Pedigree chart</p>
    <h1 id="title">Family tree</h1>
    <p class="sub" id="sub"></p>
  </div>
  <div class="tools" role="toolbar" aria-label="Chart controls">
    <div class="find"><label class="vh" for="find">Find a person</label><input type="search" id="find" placeholder="Find a person" role="combobox" aria-expanded="false" aria-controls="findlist" aria-autocomplete="list" autocomplete="off"><ul class="combolist" id="findlist" role="listbox" aria-label="Matching people" hidden></ul></div>
    <label class="sel" for="depth"><span>Generations</span><select id="depth"></select></label>
    <div class="grp">
      <button class="btn sq" id="zout" type="button" aria-label="Zoom out">&minus;</button>
      <button class="btn" id="zlabel" type="button" title="Reset to 100%" aria-label="Zoom level. Activate to reset to 100 percent.">100%</button>
      <button class="btn sq" id="zin" type="button" aria-label="Zoom in">+</button>
    </div>
    <button class="btn" id="fit" type="button">Fit to screen</button>
    <button class="btn" id="cz" type="button" aria-pressed="false" aria-controls="czp"><span class="tg" aria-hidden="true">&#9733;</span>Famous relatives</button>
    <div class="mwrap"><button class="btn" id="viewbtn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="viewmenu">View <span class="car" aria-hidden="true">&#9662;</span></button>
      <div class="menu" id="viewmenu" role="group" aria-label="View options" hidden>
        <label class="chk" for="showliv"><input type="checkbox" id="showliv"> Show birth years of living people</label>
        <label class="chk" for="showph"><input type="checkbox" id="showph"> Show photos on cards</label>
        <fieldset class="mfs"><legend>Names on the chart</legend>
          <label class="chk"><input type="radio" name="nameview" value="birth"> Birth names</label>
          <label class="chk"><input type="radio" name="nameview" value="married"> Married names</label>
        </fieldset>
        <hr>
        <button class="btn mi" type="button" data-pic="png">Save chart as picture (PNG)</button>
        <button class="btn mi" type="button" data-pic="svg">Save chart as picture (SVG)</button>
        <button class="btn mi" type="button" data-ro>Save as read-only web page (HTML)</button>
      </div></div>
    <div class="mwrap"><button class="btn" id="explorebtn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="exploremenu">Explore <span class="car" aria-hidden="true">&#9662;</span></button>
      <div class="menu" id="exploremenu" role="group" aria-label="Explore the tree" hidden>
        <button class="btn mi" type="button" data-x="rel">Relationship calculator</button>
        <button class="btn mi" type="button" data-x="report">Tree report: completeness and brick walls</button>
        <button class="btn mi" type="button" data-x="places">Places and migration</button>
        <button class="btn mi" type="button" data-x="timeline">Timeline</button>
      </div></div>
    <button class="btn" id="edit" type="button" aria-pressed="false" aria-controls="editbar"><svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.8 2.4l2.8 2.8-8.2 8.2-3.5.7.7-3.5z"/><path d="M9.3 3.9l2.8 2.8"/></svg>Edit</button>
  </div>
</header>

<div class="editbar" id="editbar" role="region" aria-label="Edit mode" hidden>
  <span class="lbl">Editing</span>
  <span class="tip">Use the pencil on a card to change a person. Dashed cards add a missing parent.</span>
  <div class="grp"><button class="btn" type="button" id="undo" data-e="undo" disabled>&#8630; Undo</button><button class="btn" type="button" id="redo" data-e="redo" disabled>Redo &#8631;</button></div>
  <button class="btn" type="button" data-e="history">History</button>
  <button class="btn" type="button" data-e="me">Edit yourself</button>
  <button class="btn" type="button" data-e="famous">Famous relatives</button>
  <button class="btn" type="button" data-e="data">Backup &amp; reset</button>
  <span class="save" id="savest" role="status"></span>
  <button class="btn primary" type="button" data-e="done">Done</button>
</div>

<div class="meta">
  <ul class="legend" id="legend" aria-label="Grandparent lines"></ul>
  <p class="status"><span id="status"></span><span class="hintkeys"> &nbsp;·&nbsp; Drag to pan, Ctrl or &#8984; + scroll to zoom</span></p>
</div>

<div class="work">
<section class="czp" id="czp" aria-label="Famous relatives" hidden></section>

<main class="stage" id="stage">
  <div class="heads" id="heads" aria-hidden="true"><div class="hin" id="hin"></div></div>
  <div class="viewport" id="vp" tabindex="0" aria-label="Pedigree chart. Scroll or drag to pan.">
    <div class="sizer" id="sizer"><div class="world" id="world"></div></div>
  </div>
  <div class="pop" id="pop" role="dialog" aria-label="Person details" tabindex="-1" hidden></div>
</main>
</div>

<div class="toast" id="toast" role="status" hidden></div>
<div class="scrim" id="scrim" hidden></div>
<aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-t" hidden></aside>

<script src="js/sample-data.js" data-pb></script>
<script src="js/core.js" data-pb></script>
<script src="js/chart.js" data-pb></script>
<script src="js/editing.js" data-pb></script>
<script src="js/storage.js" data-pb></script>
<script src="js/files-gedcom.js" data-pb></script>
<script src="js/picture.js" data-pb></script>
<script src="js/explore.js" data-pb></script>
<script src="js/main.js" data-pb></script>
</body>
</html>
